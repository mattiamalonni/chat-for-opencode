name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and package only (no Marketplace publish, no GitHub release)
        type: boolean
        default: true
      version:
        description: Exact package.json version to publish (required when dry-run is false)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml's contract job writes the contract-drift issue; called workflows can only
    # downgrade the caller's permissions, so the caller must grant this scope explicitly.
    permissions:
      contents: read
      issues: write

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify the version to publish
        # Applies to every path: a tag must match package.json, and a manual publish must confirm
        # the exact version through the input instead of silently shipping whatever is on main.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
            publish=true
          else
            expected="$REQUESTED_VERSION"
            if [ "$DRY_RUN" = "false" ] && [ -n "$expected" ]; then publish=true; else publish=false; fi
          fi
          if [ -n "$expected" ] && [ "$expected" != "$version" ]; then
            echo "::error::Requested version $expected does not match package.json version $version"
            exit 1
          fi
          if [ "$publish" = "true" ] && [ -z "$expected" ]; then
            echo "::error::A manual publish requires the 'version' input to confirm $version"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          file="chat-for-opencode-$version.vsix"
          npx vsce package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.file }}

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.package.outputs.version }}" '
            $0 ~ "^## " v "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md" > release-notes.md; fi
          cat release-notes.md

      - name: Publish to Visual Studio Marketplace
        if: github.ref_type == 'tag' || (!inputs.dry-run && inputs.version != '')
        run: npx vsce publish --packagePath "${{ steps.package.outputs.file }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
