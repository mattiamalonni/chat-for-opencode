name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # Contract tests need a real `opencode` binary and a provider, so they are opt-in
  # (manual) and also run nightly instead of on every push/PR.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, build, unit + UI tests
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        # A blocking gate now: to waive a transitive CVE, pin a patched version via an explicit
        # `overrides` entry in package.json (with a comment) instead of disabling this step.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - name: Generated docs and local links are up to date
        if: runner.os == 'Linux'
        run: npm run verify:docs && npm run verify:links
      - name: Generated OpenAPI types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/shared/openapi.generated.ts
      - run: npm run compile
      - run: npm run test:unit
        # `test:unit` already runs test/unit/contractSnapshot.test.ts (vitest.config.mts includes
        # test/unit/**/*.test.ts); a separate gate step only reran the same file on all 3 runners.
      - name: Coverage thresholds
        # Enforce the configured floors on one runner; the other two keep the faster unit-only run.
        if: runner.os == 'Linux'
        run: npm run test:coverage

      # The Chromium binary is ~150 MB. Reuse it across runs; `playwright install`
      # then only checks the (cheap) system dependencies. Both are Linux-only here
      # (`--with-deps` needs apt), so the UI tests stay a single-platform gate.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      # `compile` already produced dist/webview.js + .css. The `:ci` variant calls Playwright
      # directly; the plain script keeps its own `compile` for local `npm run verify` use.
      - name: UI tests + webview coverage (Linux)
        if: runner.os == 'Linux'
        run: npm run test:coverage:ui:ci
        env:
          OC_UI_COVERAGE_MIN: 55
      # The shipped artefact is minified and built without source maps: exercise it too, so a
      # regression that only exists in the production bundle cannot reach the Marketplace.
      - name: Production bundle smoke (Linux)
        if: runner.os == 'Linux'
        run: npm run test:ui:prod
      - name: Upload UI screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: test/ui/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload Playwright artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  integration:
    name: VS Code integration (${{ matrix.os }} / ${{ matrix.vscode }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: "1.99.3"
          - os: macos-latest
            vscode: stable
          - os: windows-latest
            vscode: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache only the downloaded binary (vscode-<platform>-<version>). Caching
      # the whole .vscode-test folder would also restore user-data/extensions:
      # stale global state makes the extension resume a session the fresh mock
      # server doesn't know, and the prompt tests hang or fail.
      - uses: actions/cache@v4
        with:
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-vscode-bin-v3-${{ matrix.vscode }}-${{ hashFiles('package.json') }}
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  package:
    name: Package .vsix
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vsce package --out chat-for-opencode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: chat-for-opencode.vsix

  contract:
    name: Contract (opencode@2.3.0)
    # Only on manual/scheduled runs: these tests hit a real `opencode serve` and a provider.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install opencode 2.3.0
        run: npm install -g opencode@2.3.0
      - name: Contract e2e tests
        id: contract-tests
        run: npm run test:e2e
        # A missing provider/network or an upstream API drift must not block releases, but the
        # steps below make sure it is visible instead of silently showing a green check.
        continue-on-error: true
      - name: Contract drift summary
        if: always()
        run: |
          if [ "${{ steps.contract-tests.outcome }}" = "failure" ]; then
            echo "### ⚠️ OpenCode 2.3.0 contract check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The live contract suite reported a failure. Inspect the job log to distinguish provider/network issues from API drift." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ OpenCode 2.3.0 contract check passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Report contract drift
        if: steps.contract-tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create contract-drift --description "Scheduled OpenCode contract check failed" --color b60205 || true
          existing=$(gh issue list --label contract-drift --state open --json number --jq '.[0].number' || true)
          body="The scheduled OpenCode 2.3.0 contract check failed. Review the run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "OpenCode contract drift (scheduled check)" --label contract-drift --body "$body"
          fi
