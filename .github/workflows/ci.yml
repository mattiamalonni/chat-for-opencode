name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, build, unit + UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:unit

      # The Chromium binary is ~150 MB. Reuse it across runs; `playwright install`
      # then only checks the (cheap) system dependencies.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # `compile` already produced dist/webview.js + .css, so call Playwright
      # directly instead of letting `test:ui` rebuild the same bundle.
      - run: npx playwright test
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: test/ui/screenshots/*.png
          if-no-files-found: ignore

  integration:
    name: VS Code integration (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, "1.99.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # @vscode/test-electron unpacks VS Code into .vscode-test and skips the
      # download when the folder already contains the requested version.
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: linux-vscode-${{ matrix.vscode }}-${{ hashFiles('package.json') }}
      - run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  # Windows/macOS are slow runners and the platform-specific code paths are
  # mostly in the managed server. Keep them as a release gate (this workflow is
  # called by release.yml) instead of running them on every PR/push.
  integration-cross-platform:
    name: VS Code integration (${{ matrix.os }})
    if: github.event_name == 'workflow_call'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-stable-${{ hashFiles('package.json') }}
      - run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: stable

  package:
    name: Package .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vsce package --out chat-for-opencode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: chat-for-opencode.vsix
