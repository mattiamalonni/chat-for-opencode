name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # Contract tests need a real `opencode` binary and a provider, so they are opt-in
  # (manual) and also run nightly instead of on every push/PR.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, build, unit + UI tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        # A blocking gate now: to waive a transitive CVE, pin a patched version via an explicit
        # `overrides` entry in package.json (with a comment) instead of disabling this step.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Generated OpenAPI types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/shared/openapi.generated.ts
      - run: npm run compile
      - run: npm run test:unit
      - name: Recorded contract gate (opencode@2.2.7)
        # Deterministic half of the contract gate: no server/provider needed. The live `contract`
        # job remains opt-in because it needs a real binary and credentials.
        run: npx vitest run test/unit/contractSnapshot.test.ts
      - name: Coverage thresholds
        # Enforce the configured floors on one runner; the other two keep the faster unit-only run.
        if: runner.os == 'Linux'
        run: npm run test:coverage

      # The Chromium binary is ~150 MB. Reuse it across runs; `playwright install`
      # then only checks the (cheap) system dependencies. Both are Linux-only here
      # (`--with-deps` needs apt), so the UI tests stay a single-platform gate.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      # `compile` already produced dist/webview.js + .css, so call Playwright
      # directly instead of letting `test:ui` rebuild the same bundle.
      - run: npx playwright test
        if: runner.os == 'Linux'
      - name: Upload UI screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: test/ui/screenshots/*.png
          if-no-files-found: ignore
      - name: Upload Playwright artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  integration:
    name: VS Code integration (${{ matrix.os }} / ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: "1.99.3"
          - os: macos-latest
            vscode: stable
          - os: windows-latest
            vscode: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cache only the downloaded binary (vscode-<platform>-<version>). Caching
      # the whole .vscode-test folder would also restore user-data/extensions:
      # stale global state makes the extension resume a session the fresh mock
      # server doesn't know, and the prompt tests hang or fail.
      - uses: actions/cache@v4
        with:
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-vscode-bin-v3-${{ matrix.vscode }}-${{ hashFiles('package.json') }}
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  package:
    name: Package .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vsce package --out chat-for-opencode.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: chat-for-opencode.vsix

  contract:
    name: Contract (opencode@2.2.7)
    # Only on manual/scheduled runs: these tests hit a real `opencode serve` and a provider.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install opencode 2.2.7
        run: npm install -g opencode@2.2.7
      - name: Contract e2e tests
        run: npm run test:e2e
        # A missing provider/network or an upstream API drift must not block releases.
        continue-on-error: true
