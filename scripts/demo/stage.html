<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
  Stage for the README demo (scripts/record-demo.mjs): a generic code editor on the left and the real
  chat webview (test/ui/harness.html + dist/webview.js) on the right. The editor is a plain mock with
  no product branding; only the chat is the actual extension UI.
-->
    <title>OpenCode chat demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #181818;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .stage {
        display: flex;
        height: 100%;
      }
      .editor {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #1f1f1f;
        border-right: 1px solid #2b2b2b;
      }
      .tabs {
        display: flex;
        height: 35px;
        background: #181818;
        border-bottom: 1px solid #2b2b2b;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        background: #1f1f1f;
        border-top: 1px solid #0078d4;
        border-right: 1px solid #2b2b2b;
        color: #ffffff;
        font-size: 13px;
      }
      .tab .ts {
        color: #4d9cd6;
        font-weight: 700;
        font-size: 11px;
      }
      .tab .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: transparent;
        transition: background 200ms ease;
      }
      .tab.modified .dot {
        background: #cccccc;
      }
      .crumbs {
        padding: 4px 16px;
        color: #9d9d9d;
        font-size: 12px;
      }
      pre.code {
        margin: 6px 0 0;
        font-family: Menlo, Monaco, "Courier New", monospace;
        font-size: 13px;
        line-height: 21px;
        color: #cccccc;
      }
      /* Block lines (not flex): flex items would drop the spaces between the highlighted tokens. */
      .line {
        white-space: pre;
      }
      .ln {
        display: inline-block;
        width: 52px;
        padding-right: 18px;
        text-align: right;
        color: #6e7681;
      }
      .line.sel {
        background: #264f78;
      }
      .line.sel .ln {
        color: #cccccc;
      }
      .line.changed {
        background: rgba(46, 160, 67, 0.22);
        box-shadow: inset 3px 0 0 #2ea043;
      }
      .k {
        color: #569cd6;
      }
      .c {
        color: #c586c0;
      }
      .t {
        color: #4ec9b0;
      }
      .f {
        color: #dcdcaa;
      }
      .n {
        color: #b5cea8;
      }
      .v {
        color: #9cdcfe;
      }
      .chat {
        width: 420px;
        flex: none;
        display: flex;
        flex-direction: column;
        background: #181818;
      }
      .chat-title {
        height: 35px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: #cccccc;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border-bottom: 1px solid #2b2b2b;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        display: block;
      }
      .cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        pointer-events: none;
        z-index: 10;
        transform: translate(-100px, -100px);
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
      }
      .ripple {
        position: fixed;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        border: 2px solid rgba(77, 170, 252, 0.9);
        pointer-events: none;
        z-index: 9;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="editor">
        <div class="tabs">
          <div class="tab" id="tab"><span class="ts">TS</span>cart.ts<span class="dot"></span></div>
        </div>
        <div class="crumbs">src › cart.ts › total</div>
        <pre class="code" id="code"></pre>
      </div>
      <div class="chat">
        <div class="chat-title">OpenCode</div>
        <iframe id="chat" title="OpenCode chat" src="../../test/ui/harness.html"></iframe>
      </div>
    </div>
    <svg class="cursor" id="cursor" viewBox="0 0 22 22">
      <path d="M3 2 L3 18 L7.5 13.8 L10.6 20.4 L13.4 19.1 L10.4 12.6 L16.5 12.6 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
    </svg>
    <div class="ripple" id="ripple"></div>
  </body>
</html>
