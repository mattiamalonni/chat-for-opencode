<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Same CSP shape as the real webview (see src/chat/viewProvider.ts). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file: 'unsafe-inline'; img-src data:;">
<link id="theme" rel="stylesheet" href="theme-dark.css">
<link rel="stylesheet" href="../../dist/webview.css">
<script>
  // Fake VS Code host bridge: records posted messages; tests reply with window.postMessage.
  window.__posted = [];
  window.__windowKeys = [];
  // Like the VS Code preload, listen on window in the bubble phase.
  window.addEventListener("keydown", (e) => window.__windowKeys.push((e.ctrlKey ? "Ctrl+" : "") + (e.metaKey ? "Meta+" : "") + (e.altKey ? "Alt+" : "") + e.key));
  let state;
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => {
      window.__posted.push(JSON.parse(JSON.stringify(m)));
      // The real host turns dropped files into attachments; mimic that reply here.
      if (m && m.type === "dropFiles") {
        setTimeout(() => {
          for (const f of m.files) {
            const uri = f.uri || (f.path ? "file://" + f.path.replace(/\\/g, "/") : "data:" + (f.mime || "text/plain") + ";base64," + f.base64);
            window.postMessage({ type: "addAttachment", item: { uri, name: f.name, kind: "file", detail: f.name } }, "*");
          }
        }, 0);
      }
    },
    getState: () => state,
    setState: (s) => { state = s; },
  });
</script>
</head>
<body>
<div id="root"></div>
<script src="../../dist/webview.js"></script>
</body>
</html>
